<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Search engines read these two lines. Edit them here. -->
<title>Tai Pham | Sales Analyst</title>
<meta name="description" content="Tai Pham, Sales Analyst. Data, reporting and business intelligence.">
<link rel="stylesheet" href="style.css">
</head>
<body id="top">

<!-- ============================================================
     PAGE STRUCTURE ONLY.
     To change text, pictures, projects or career: edit content.js
     ============================================================ -->

<header>
  <nav class="nav" aria-label="Main">
    <div class="menu">
      <a href="#about" data-text="nav.about"></a>
      <a href="#work" data-text="nav.work"></a>
      <a href="#career" data-text="nav.career"></a>
      <a href="#contact" data-text="nav.contact"></a>
    </div>
    <a class="brand" href="#top" data-text="name"></a>
    <div class="social" id="social"></div>
  </nav>
</header>

<main>
  <!-- Intro: profile picture + description -->
  <div class="hero" id="about">
    <div class="hero-about">
      <img id="profile" width="800" height="800" alt="">
      <div class="hero-text" id="about-text"></div>
    </div>
  </div>

  <!-- Work -->
  <section id="work">
    <div class="inner">
      <h2 data-text="work.title"></h2>
      <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
      <div class="grid" id="projects"></div>
      <p class="note" data-text="work.note"></p>
    </div>
  </section>

  <!-- Career -->
  <section id="career" class="alt">
    <div class="inner">
      <h2 data-text="career.title"></h2>
      <div class="legend" id="legend" aria-hidden="true"></div>
      <ol class="timeline" id="timeline" aria-label="Career timeline"></ol>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="contact">
    <div class="inner">
      <h2 data-text="contact.title"></h2>
      <p data-text="contact.text"></p>
      <a class="btn" id="btn-linkedin" target="_blank" rel="noopener noreferrer" data-text="contact.linkedinButton"></a>
      <button class="btn" id="mail" type="button" data-text="contact.emailButton"></button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
  </section>
</main>

<!-- Project pop-up -->
<dialog id="dlg" aria-labelledby="dtitle">
  <div class="dhead">
    <h3 id="dtitle"></h3>
    <button class="close" id="dclose" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="dmedia" id="dmedia"></div>
  <div class="dtext">
    <div class="tag" id="dtag"></div>
    <p id="ddesc"></p>
    <p class="dhint" id="dhint" hidden data-text="work.interactiveHint"></p>
    <div class="dactions">
      <a class="btn" id="dlink" target="_blank" rel="noopener noreferrer"></a>
      <button class="btn secondary" id="dfull" type="button" hidden data-text="work.fullscreenButton"></button>
    </div>
  </div>
</dialog>

<footer><span id="footer-text"></span></footer>

<script src="content.js"></script>
<script src="script.js"></script>
</body>
</html>
